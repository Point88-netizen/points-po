name: Design

on:
  pull_request:
    paths: ["design/**", "app/**", "package.json", ".github/workflows/design.yml"]
  push:
    branches: [main]

jobs:
  systeme:
    name: Système de design
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      # La CI lance exactement les commandes du README. Si elles divergent,
      # ce qui passe ici cesse de dire quoi que ce soit sur ce qui passe
      # chez la personne qui développe.
      - name: Installer
        run: npm install

      - name: Régénérer les tokens
        run: npm run tokens

      - name: Vérifier que build/ est à jour
        run: git diff --exit-code design/build/
          || (echo "::error::design/build/ n'est pas à jour — lancez npm run tokens et committez." && exit 1)

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Servir le prototype
        run: npm run dev & sleep 3

      - name: Vérifications
        run: npm run verif
